name: release

# Publishing is a tag, never a branch push: only the master opens the gate, and
# a `v*` tag is the human-authorized event this workflow reacts to. A tag can be
# pushed for a commit on any branch, so the job also proves the commit is on
# `main` and runs the same `verify` gate PRs run before it publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # npm provenance (OIDC token to the transparency log)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes want the commits since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # A tag that disagrees with the manifest would publish 0.1.0 under v0.2.0.
      - name: Tag matches the package version
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # A tag is not evidence that the commit was reviewed: a tag can point at a
      # branch commit or a detached HEAD. Only a commit that is an ancestor of
      # `origin/main` may publish. This runs before anything is built or pushed.
      - name: The tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main; refusing to publish"
            exit 1
          fi

      # `verify` is the same gate PRs pass: structural checks, the packaged
      # tarball and its install smoke, the full test suite, and zero skips. Its
      # oracles need the pinned harnesses, the pinned Claude Code CLI, and the
      # pinned upstream mods tree, so fetch all three here rather than trusting
      # a laptop state. Everything is pinned; nothing fetches `latest`.
      - name: Fetch the pinned oracles
        run: |
          set -euo pipefail
          tree=$(node scripts/fetch-mod.mjs)
          {
            echo "ANYPLUGIN_MODS_TREE=$tree"
            echo "ANYPLUGIN_MOD_TREE=$tree/mods/diff/hooks"
            echo "CLAUDE_BIN=$(node scripts/fetch-claude.mjs)"
            echo "HARNESS_RC5=$(node scripts/fetch-harness.mjs 0.2.2-rc.5)"
            echo "HARNESS_RC2=$(node scripts/fetch-harness.mjs 0.2.2-rc.2)"
          } >> "$GITHUB_ENV"

      # Both pins are verified in one job, like `verify.yml`: a failure on one
      # must not prevent the other from running, and a skipped test is a
      # failure by design (D22/D24). `check:pack` and its install smoke run as
      # part of `npm run verify`, so the tarball that publishes is the tarball
      # that booted.
      - name: Verify both DSH pins
        run: |
          set -uo pipefail
          status=0
          verify_pin() {
            version="$1"
            dir="$2"
            echo "::group::verify with DSH $version"
            if [ -z "${dir:-}" ] || [ ! -d "$dir/node_modules/@deepseek-ai" ]; then
              echo "::error::no fetched harness for DSH $version; a skipped fidelity test on CI is a bug"
              status=1
            else
              verify_log="$(mktemp)"
              if ! DSH_HARNESS_DIR="$dir" DSH_HARNESS_VERSION="$version" npm run verify >"$verify_log" 2>&1; then
                status=1
              fi
              cat "$verify_log"
              if ! grep -Eq '^ℹ skipped 0$' "$verify_log"; then
                echo "::error::verify skipped at least one test for DSH $version; a skipped fidelity test on CI is a bug"
                status=1
              fi
              rm -f "$verify_log"
            fi
            echo "::endgroup::"
          }
          verify_pin 0.2.2-rc.5 "$HARNESS_RC5"
          verify_pin 0.2.2-rc.2 "$HARNESS_RC2"
          exit "$status"

      # v0.1.0 bootstraps with the account token. From 0.1.1 the package is
      # linked to the trusted publisher, and NODE_AUTH_TOKEN is removed: the
      # OIDC identity then authorizes both the publish and its provenance.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "dsh-anyplugin ${GITHUB_REF_NAME}" --generate-notes
