name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, deliberately not a matrix: branch protection requires the check
  # context to be exactly `verify`, and a matrix job reports as `verify (x)`.
  # Both DSH pins are fetched and verified in this job; a failure on one pin
  # must not prevent the other from running. The pinned Claude Code CLI is
  # fetched once and serves the upstream half of every run.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # The shape of the tree is a gate, not a review comment.
      - run: npm run check:arch

      # The mod host's upstream acceptance is a refusal: the fetched `diff`
      # graph reaches a `.tsx`, which D30 keeps planned. Fetching is explicit,
      # like the harness and CLI pins; the diff test never touches the network
      # and fails on CI when ANYPLUGIN_MOD_TREE is unset. The cache follows the
      # file that owns the pin, so a bump is one edit and one cold cache.
      - name: Cache pinned diff mod
        uses: actions/cache@v4
        with:
          path: .mods
          key: mods-${{ hashFiles('packages/dsh-anyplugin-mod-host/src/pin.ts', 'scripts/fetch-mod.mjs') }}

      - name: Install pinned diff mod
        id: mod
        run: |
          tree=$(node scripts/fetch-mod.mjs)
          echo "ANYPLUGIN_MOD_TREE=$tree" >> "$GITHUB_ENV"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      # Refuse to let the acceptance test skip: an unset tree or a different
      # checkout is a failed job, not a green run with one test missing.
      - name: Guard the pinned diff mod
        env:
          ANYPLUGIN_MOD_TREE: ${{ steps.mod.outputs.tree }}
        run: |
          if [ -z "${ANYPLUGIN_MOD_TREE:-}" ]; then
            echo "::error::ANYPLUGIN_MOD_TREE is unset; the diff refusal test would skip and a skipped acceptance test on CI is a bug"
            exit 1
          fi
          verified=$(node scripts/fetch-mod.mjs --verify)
          if [ "$verified" != "$ANYPLUGIN_MOD_TREE" ]; then
            echo "::error::ANYPLUGIN_MOD_TREE=$ANYPLUGIN_MOD_TREE does not match the pinned tree $verified"
            exit 1
          fi

      # The upstream oracle needs the pinned Claude Code CLI, and CI has no
      # Desktop installation to borrow one from. Like the DSH harness, fetching
      # is an explicit step here: the tests themselves never touch the network.
      # The cache follows the one file that owns the pin, so a bump is one edit
      # and one cold cache. This step is not continue-on-error: without the CLI
      # the upstream half would skip, and a skipped fidelity test on CI is a bug.
      - name: Cache pinned Claude Code CLI
        uses: actions/cache@v4
        with:
          path: .claude-code
          key: claude-code-${{ hashFiles('packages/dsh-anyplugin-conformance/src/pin.ts', 'scripts/fetch-claude.mjs') }}

      - name: Install pinned Claude Code CLI
        id: claude
        run: |
          bin=$(node scripts/fetch-claude.mjs)
          echo "CLAUDE_BIN=$bin" >> "$GITHUB_ENV"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # The upstream twin of the DSH_HARNESS_DIR guard below: fail when the
      # binary is missing, and check its version against the same constant the
      # tests use, so a stale cache or a PATH fallback cannot pass silently.
      - name: Guard the pinned Claude Code CLI
        env:
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
        run: |
          if [ -z "${CLAUDE_BIN:-}" ]; then
            echo "::error::CLAUDE_BIN is unset; the upstream oracle would skip and a skipped fidelity test on CI is a bug"
            exit 1
          fi
          node scripts/fetch-claude.mjs --verify "$CLAUDE_BIN"

      # Fetching is an explicit step; the tests themselves never touch the
      # network. A fetch failure must not hide behind `set -e` inside a
      # command substitution: each pin is attempted, its status recorded, and
      # the step fails only after both were tried. continue-on-error keeps the
      # job alive so the pin that did fetch can still be verified.
      - name: Fetch DSH harness pins
        id: fetch
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          fetch_pin() {
            version="$1"
            output="$2"
            echo "::group::fetch DSH $version"
            if dir=$(node scripts/fetch-harness.mjs "$version"); then
              printf '%s=%s\n' "$output" "$dir" >> "$GITHUB_OUTPUT"
              echo "fetched DSH $version at $dir"
            else
              code=$?
              echo "::error::failed to fetch DSH $version (exit $code)"
              status=1
            fi
            echo "::endgroup::"
          }
          fetch_pin 0.2.2-rc.5 dir_rc5
          fetch_pin 0.2.2-rc.2 dir_rc2
          exit "$status"

      # `verify` now includes a lifecycle probe that runs a real turn: the
      # coverage row is a handler's log line, so the suite must compose an
      # agent loop, a subagent runtime and a filesystem, not just the layer's
      # own deps. These nine direct packages are the graph's minimum; the other
      # rows of the §10 S9 composition table arrive transitively (or are base
      # deps). Each fetched pin gets the same packages at its own version; the
      # tests never fetch.
      - name: Install turn-graph pins for the conformance oracle
        env:
          DIR_RC5: ${{ steps.fetch.outputs.dir_rc5 }}
          DIR_RC2: ${{ steps.fetch.outputs.dir_rc2 }}
        run: |
          set -euo pipefail
          install_pin() {
            version="$1"
            dir="$2"
            if [ -z "${dir:-}" ] || [ ! -d "$dir/node_modules/@deepseek-ai" ]; then
              echo "::error::cannot install the turn-graph pins for DSH $version: harness dir is missing"
              exit 1
            fi
            npm install --prefix "$dir" --no-save --ignore-scripts --cache "$PWD/.npm-cache" \
              @deepseek-ai/dsh-agent-loop@$version \
              @deepseek-ai/dsh-subagent@$version \
              @deepseek-ai/dsh-subagent-fork-in-process@$version \
              @deepseek-ai/dsh-fs-local@$version \
              @deepseek-ai/dsh-working-directory@$version \
              @deepseek-ai/dsh-llm@$version \
              @deepseek-ai/dsh-session@$version \
              @deepseek-ai/dsh-session-projection@$version \
              @deepseek-ai/dsh-agent@$version
          }
          install_pin 0.2.2-rc.5 "$DIR_RC5"
          install_pin 0.2.2-rc.2 "$DIR_RC2"

      # A skipped fidelity test on CI is a bug. The guard is per pin so a
      # missing rc.5 cannot stop rc.2 from being verified.
      - name: Guard and verify each resolved pin
        env:
          DIR_RC5: ${{ steps.fetch.outputs.dir_rc5 }}
          DIR_RC2: ${{ steps.fetch.outputs.dir_rc2 }}
        run: |
          set -uo pipefail
          status=0
          verify_pin() {
            version="$1"
            dir="$2"
            echo "::group::verify with DSH $version"
            if [ -z "${dir:-}" ]; then
              echo "::error::DSH_HARNESS_DIR is unset for DSH $version (fetch failed); a skipped fidelity test on CI is a bug"
              status=1
            elif [ ! -d "$dir/node_modules/@deepseek-ai" ]; then
              echo "::error::DSH_HARNESS_DIR=$dir is missing for DSH $version"
              status=1
            else
              export DSH_HARNESS_DIR="$dir"
              export DSH_HARNESS_VERSION="$version"
              if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR" ]; then
                echo "::error::DSH_HARNESS_DIR is unset or missing for DSH $version"
                status=1
              else
                verify_log="$(mktemp)"
                npm run verify >"$verify_log" 2>&1 || status=1
                cat "$verify_log"
                if ! grep -Eq '^ℹ skipped 0$' "$verify_log"; then
                  echo "::error::verify skipped at least one test for DSH $version; a skipped fidelity test on CI is a bug"
                  status=1
                fi
                rm -f "$verify_log"
              fi
            fi
            echo "::endgroup::"
          }
          verify_pin 0.2.2-rc.5 "$DIR_RC5"
          verify_pin 0.2.2-rc.2 "$DIR_RC2"
          exit "$status"

      # S9 is a spike, not a test: a 0/0 run is a failure. Install the extra
      # pinned packages the turn/lifecycle probes need, then run the script.
      - name: S9 host-event spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S9 spike would skip"
            exit 1
          fi
          npm install --prefix "$DSH_HARNESS_DIR" --no-save --ignore-scripts --cache "$PWD/.npm-cache" \
            @deepseek-ai/dsh-agent-loop@0.2.2-rc.5 \
            @deepseek-ai/dsh-subagent@0.2.2-rc.5 \
            @deepseek-ai/dsh-subagent-fork-in-process@0.2.2-rc.5 \
            @deepseek-ai/dsh-tool-subagent@0.2.2-rc.5 \
            @deepseek-ai/dsh-compaction-basic@0.2.2-rc.5 \
            @deepseek-ai/dsh-agent-team@0.2.2-rc.5 \
            @deepseek-ai/dsh-working-directory@0.2.2-rc.5 \
            @deepseek-ai/dsh-tool-fs@0.2.2-rc.5 \
            @deepseek-ai/dsh-fs-local@0.2.2-rc.5 \
            @deepseek-ai/dsh-fs-observation-policy@0.2.2-rc.5 \
            @deepseek-ai/dsh-user-questions@0.2.2-rc.5 \
            @deepseek-ai/dsh-settings@0.2.2-rc.5 \
            @deepseek-ai/dsh-experimental-worktree@0.2.2-rc.5 \
            @deepseek-ai/dsh-agent-instructions@0.2.2-rc.5 \
            @deepseek-ai/dsh-tool-fs-search@0.2.2-rc.5
          npm run spike:s9

      # S10 is also a spike: 16/16 checks are required, including the child
      # receiving the fixture body. Install the extra pins it boots, then run it.
      # This runs after S9 because `--no-save` prunes packages the other spike
      # installed; each step keeps its own complete list.
      - name: S10 agent-catalog spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S10 spike would skip"
            exit 1
          fi
          npm install --prefix "$DSH_HARNESS_DIR" --no-save --ignore-scripts --cache "$PWD/.npm-cache" \
            @deepseek-ai/dsh-agent-loop@0.2.2-rc.5 \
            @deepseek-ai/dsh-subagent@0.2.2-rc.5 \
            @deepseek-ai/dsh-subagent-spawn-in-process@0.2.2-rc.5 \
            @deepseek-ai/dsh-tool-subagent@0.2.2-rc.5 \
            @deepseek-ai/dsh-session-persistence-jsonl@0.2.2-rc.5 \
            @deepseek-ai/dsh-working-directory@0.2.2-rc.5 \
            @deepseek-ai/dsh-fs-local@0.2.2-rc.5
          npm run spike:s10

      # S11 is a spike too: 16/16 checks are required, including the command
      # handler's byte-for-byte `complete: true` prompt and the sibling/compaction
      # proofs. It boots the command service, the loader (to resolve the persona
      # row), the preset registry and the compaction engine. Like S9/S10, this
      # step owns a complete install list because `--no-save` prunes the previous
      # step's extras.
      - name: S11 prompt-scope spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S11 spike would skip"
            exit 1
          fi
          npm install --prefix "$DSH_HARNESS_DIR" --no-save --ignore-scripts --cache "$PWD/.npm-cache" \
            @deepseek-ai/dsh-agent-loop@0.2.2-rc.5 \
            @deepseek-ai/dsh-agent@0.2.2-rc.5 \
            @deepseek-ai/dsh-llm@0.2.2-rc.5 \
            @deepseek-ai/dsh-session@0.2.2-rc.5 \
            @deepseek-ai/dsh-session-projection@0.2.2-rc.5 \
            @deepseek-ai/dsh-commands@0.2.2-rc.5 \
            @deepseek-ai/dsh-compaction-basic@0.2.2-rc.5 \
            @deepseek-ai/dsh-token-meter@0.2.2-rc.5 \
            @deepseek-ai/dsh-persona@0.2.2-rc.5 \
            @deepseek-ai/dsh-agent-preset@0.2.2-rc.5 \
            @deepseek-ai/dsh-agent-preset-registry@0.2.2-rc.5
          npm run spike:s11

      # continue-on-error deliberately kept the job alive; make the fetch
      # failure fail the job after the successfully fetched pin has run.
      - name: Fail if a harness fetch failed
        if: always()
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::error::at least one DSH harness fetch failed; see the fetch step"
            exit 1
          fi
