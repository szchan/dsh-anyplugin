name: verify

on:
  # Push only. A commit can carry at most one check named `verify`, and branch
  # protection reads that name; a `pull_request` trigger for the same commit
  # produced a second run under the same name and blocked the merge with one of
  # them still pending. External PRs are read, then re-pushed onto one of our
  # branches — that push is what produces the required check (docs/TRIAGE.md).
  push:
    branches: ["**"]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, deliberately not a matrix: branch protection requires the check
  # context to be exactly `verify`, and a matrix job reports as `verify (x)`.
  # Both DSH pins are fetched and verified in this job; a failure on one pin
  # must not prevent the other from running. The pinned Claude Code CLI is
  # fetched once and serves the upstream half of every run.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # The shape of the tree is a gate, not a review comment, and the
      # capability map must keep pointing at things that exist.
      - run: npm run check:arch
      - run: npm run check:features
      - run: npm run check:decisions

      # The upstream mods table scans and loads every mod that ships under
      # `mods/` at the pinned Claude Code commit. Fetching is explicit, like
      # the harness and CLI pins; the mod tests never touch the network and
      # fail on CI when their tree is unset. The cache follows the files that
      # own the pin, so a bump is one edit and one cold cache.
      - name: Cache pinned upstream mods
        uses: actions/cache@v4
        with:
          path: .mods
          key: mods-${{ hashFiles('packages/dsh-anyplugin-mod-host/src/pin.ts', 'scripts/fetch-mod.mjs') }}

      - name: Install pinned upstream mods
        id: mod
        run: |
          tree=$(node scripts/fetch-mod.mjs)
          diff_tree="$tree/mods/diff/hooks"
          echo "ANYPLUGIN_MODS_TREE=$tree" >> "$GITHUB_ENV"
          echo "ANYPLUGIN_MOD_TREE=$diff_tree" >> "$GITHUB_ENV"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "diff_tree=$diff_tree" >> "$GITHUB_OUTPUT"

      # Refuse to let either mod test skip: an unset tree, a different
      # checkout, or a missing entry is a failed job, not a green run with a
      # test missing.
      - name: Guard the pinned upstream mods
        env:
          ANYPLUGIN_MODS_TREE: ${{ steps.mod.outputs.tree }}
          ANYPLUGIN_MOD_TREE: ${{ steps.mod.outputs.diff_tree }}
        run: |
          if [ -z "${ANYPLUGIN_MODS_TREE:-}" ] || [ -z "${ANYPLUGIN_MOD_TREE:-}" ]; then
            echo "::error::the pinned mod tree is unset; a mod test would skip and a skipped acceptance test on CI is a bug"
            exit 1
          fi
          verified=$(node scripts/fetch-mod.mjs --verify)
          if [ "$verified" != "$ANYPLUGIN_MODS_TREE" ]; then
            echo "::error::ANYPLUGIN_MODS_TREE=$ANYPLUGIN_MODS_TREE does not match the pinned tree $verified"
            exit 1
          fi
          if [ "$ANYPLUGIN_MOD_TREE" != "$ANYPLUGIN_MODS_TREE/mods/diff/hooks" ]; then
            echo "::error::ANYPLUGIN_MOD_TREE=$ANYPLUGIN_MOD_TREE is not the diff root inside the pinned tree"
            exit 1
          fi
          if [ ! -f "$ANYPLUGIN_MOD_TREE/register.ts" ]; then
            echo "::error::$ANYPLUGIN_MOD_TREE/register.ts is missing from the pinned tree"
            exit 1
          fi

      # The upstream oracle needs the pinned Claude Code CLI, and CI has no
      # Desktop installation to borrow one from. Like the DSH harness, fetching
      # is an explicit step here: the tests themselves never touch the network.
      # The cache follows the one file that owns the pin, so a bump is one edit
      # and one cold cache. This step is not continue-on-error: without the CLI
      # the upstream half would skip, and a skipped fidelity test on CI is a bug.
      - name: Cache pinned Claude Code CLI
        uses: actions/cache@v4
        with:
          path: .claude-code
          key: claude-code-${{ hashFiles('packages/dsh-anyplugin-conformance/src/pin.ts', 'scripts/fetch-claude.mjs') }}

      - name: Install pinned Claude Code CLI
        id: claude
        run: |
          bin=$(node scripts/fetch-claude.mjs)
          echo "CLAUDE_BIN=$bin" >> "$GITHUB_ENV"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # The upstream twin of the DSH_HARNESS_DIR guard below: fail when the
      # binary is missing, and check its version against the same constant the
      # tests use, so a stale cache or a PATH fallback cannot pass silently.
      - name: Guard the pinned Claude Code CLI
        env:
          CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
        run: |
          if [ -z "${CLAUDE_BIN:-}" ]; then
            echo "::error::CLAUDE_BIN is unset; the upstream oracle would skip and a skipped fidelity test on CI is a bug"
            exit 1
          fi
          node scripts/fetch-claude.mjs --verify "$CLAUDE_BIN"

      # Fetching is an explicit step; the tests themselves never touch the
      # network. A fetch failure must not hide behind `set -e` inside a
      # command substitution: each pin is attempted, its status recorded, and
      # the step fails only after both were tried. continue-on-error keeps the
      # job alive so the pin that did fetch can still be verified.
      #
      # `fetch-harness.mjs` installs the union the oracle and every spike below
      # boot, at that pin, in one `npm install`. No later step installs into
      # the tree: a second `--no-save` install would prune the first one's
      # packages, which is how a fresh tree came to fail `npm run verify`.
      - name: Fetch DSH harness pins
        id: fetch
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          fetch_pin() {
            version="$1"
            output="$2"
            echo "::group::fetch DSH $version"
            if dir=$(node scripts/fetch-harness.mjs "$version"); then
              printf '%s=%s\n' "$output" "$dir" >> "$GITHUB_OUTPUT"
              echo "fetched DSH $version at $dir"
            else
              code=$?
              echo "::error::failed to fetch DSH $version (exit $code)"
              status=1
            fi
            echo "::endgroup::"
          }
          fetch_pin 0.2.2-rc.5 dir_rc5
          fetch_pin 0.2.2-rc.2 dir_rc2
          exit "$status"

      # A skipped fidelity test on CI is a bug. The guard is per pin so a
      # missing rc.5 cannot stop rc.2 from being verified.
      - name: Guard and verify each resolved pin
        env:
          DIR_RC5: ${{ steps.fetch.outputs.dir_rc5 }}
          DIR_RC2: ${{ steps.fetch.outputs.dir_rc2 }}
        run: |
          set -uo pipefail
          status=0
          verify_pin() {
            version="$1"
            dir="$2"
            echo "::group::verify with DSH $version"
            if [ -z "${dir:-}" ]; then
              echo "::error::DSH_HARNESS_DIR is unset for DSH $version (fetch failed); a skipped fidelity test on CI is a bug"
              status=1
            elif [ ! -d "$dir/node_modules/@deepseek-ai" ]; then
              echo "::error::DSH_HARNESS_DIR=$dir is missing for DSH $version"
              status=1
            else
              export DSH_HARNESS_DIR="$dir"
              export DSH_HARNESS_VERSION="$version"
              if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR" ]; then
                echo "::error::DSH_HARNESS_DIR is unset or missing for DSH $version"
                status=1
              else
                verify_log="$(mktemp)"
                npm run verify >"$verify_log" 2>&1 || status=1
                cat "$verify_log"
                if ! grep -Eq '^ℹ skipped 0$' "$verify_log"; then
                  echo "::error::verify skipped at least one test for DSH $version; a skipped fidelity test on CI is a bug"
                  status=1
                fi
                rm -f "$verify_log"
              fi
            fi
            echo "::endgroup::"
          }
          verify_pin 0.2.2-rc.5 "$DIR_RC5"
          verify_pin 0.2.2-rc.2 "$DIR_RC2"
          exit "$status"

      # S9 is a spike, not a test: a 0/0 run is a failure. The fetch step
      # already installed the union the spike boots.
      - name: S9 host-event spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S9 spike would skip"
            exit 1
          fi
          npm run spike:s9

      # S10 is also a spike: 16/16 checks are required, including the child
      # receiving the fixture body. Its packages are in the fetched union.
      - name: S10 agent-catalog spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S10 spike would skip"
            exit 1
          fi
          npm run spike:s10

      # S11 is a spike too: 16/16 checks are required, including the command
      # handler's byte-for-byte `complete: true` prompt and the sibling/compaction
      # proofs. It boots the command service, the loader (to resolve the persona
      # row), the preset registry and the compaction engine; all of them are in
      # the fetched union.
      - name: S11 prompt-scope spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S11 spike would skip"
            exit 1
          fi
          npm run spike:s11

      # S16 is the face-by-face probe behind ARCHITECTURE §10 S16: it boots the
      # fork provider and records the child's own requests, so the nine
      # unsupported/planned faces and the exact nine-field SubagentStartRequest
      # set are checked in CI, not only locally.
      - name: S16 agent-faces spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S16 spike would skip"
            exit 1
          fi
          npm run spike:s16

      # S19 answers issue #131: whether a plugin bin/ can reach the model shell
      # PATH. It is a spike, so 19/19 checks are required at both pins; the
      # shell-env and shell-tool packages it boots are in the fetched union.
      - name: S19 PATH spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S19 spike would skip"
            exit 1
          fi
          npm run spike:s19
      - name: S19 PATH spike (rc.2)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc2 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.2
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.2; the S19 spike would skip"
            exit 1
          fi
          npm run spike:s19

      # S21 answers issue #147: a third-party package can declare a
      # `dsh.client` bundle that the pinned host composes and serves from
      # /plugins, and the harness browser half mounts it through the module
      # table — no harness rebuild. The spike boots the host half, the served
      # bytes and the browser half at both pins, so a drift reddens here.
      - name: S21 client-panel spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S21 spike would skip"
            exit 1
          fi
          npm run spike:s21
      - name: S21 client-panel spike (rc.2)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc2 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.2
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.2; the S21 spike would skip"
            exit 1
          fi
          npm run spike:s21

      # S24 answers issue #216: the documented client theme surface registers
      # alias CSS tokens, but the terminal's ANSI 16 are OSC 4/104-only. The
      # spike reads both packages from the fetched union and asserts the
      # refusal at both pins, so a host palette seam or a drift reddens here.
      - name: S24 theme-seam spike (rc.5)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc5 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.5
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.5; the S24 spike would skip"
            exit 1
          fi
          npm run spike:s24
      - name: S24 theme-seam spike (rc.2)
        env:
          DSH_HARNESS_DIR: ${{ steps.fetch.outputs.dir_rc2 }}
          DSH_HARNESS_VERSION: 0.2.2-rc.2
        run: |
          set -euo pipefail
          if [ -z "${DSH_HARNESS_DIR:-}" ] || [ ! -d "$DSH_HARNESS_DIR/node_modules/@deepseek-ai" ]; then
            echo "::error::DSH_HARNESS_DIR is unset for DSH 0.2.2-rc.2; the S24 spike would skip"
            exit 1
          fi
          npm run spike:s24

      # continue-on-error deliberately kept the job alive; make the fetch
      # failure fail the job after the successfully fetched pin has run.
      - name: Fail if a harness fetch failed
        if: always()
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::error::at least one DSH harness fetch failed; see the fetch step"
            exit 1
          fi
